<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya Saree — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#351d25;font-family:Arial,"Noto Sans Bengali",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#650d2b;color:#fff;padding:18px;border-radius:16px;margin-bottom:18px}
.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #00000010}
input,textarea,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
textarea{min-height:90px}label{display:block;font-weight:700;margin:12px 0 6px}
button{background:#8d1238;color:#fff;border:0;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.product{border:1px solid #eadfce;border-radius:14px;padding:12px;margin:10px 0;display:grid;grid-template-columns:90px 1fr;gap:12px}
.product img{width:90px;height:110px;object-fit:cover;border-radius:10px;background:#eee}.actions{display:flex;gap:8px;margin-top:8px}.actions button{width:auto;padding:8px 12px}.danger{background:#b42318}.muted{color:#77666b;font-size:13px}.hide{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.product{grid-template-columns:75px 1fr}.product img{width:75px;height:95px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h2 style="margin:0">🛍️ Aditya Saree Admin Panel</h2><div class="muted" style="color:#f6dfe7">Product Add / Edit / Delete / Price / Image</div></div>

<div id="login" class="card">
<h3>🔐 Admin Login</h3>
<label>Email</label><input id="email" type="email" placeholder="Admin email">
<label>Password</label><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg" class="muted"></p>
</div>

<div id="app" class="hide">
<div class="card">
<div class="row"><h3 style="margin:0">➕ Product Add / Edit</h3><button id="logoutBtn" style="width:auto;background:#555">Logout</button></div>
<input type="hidden" id="editId">
<div class="grid">
<div><label>Product Name *</label><input id="name" placeholder="যেমন: ঢাকাইয়া জামদানী"></div>
<div><label>Badge</label><input id="badge" placeholder="NEW / SALE"></div>
<div><div><label>Regular Price</label><input id="regular" type="number" min="0" placeholder="2250"></div></div>
<div><div><label>Offer Price *</label><input id="offer" type="number" min="0" placeholder="1890"></div></div>
<div><div><label>Sort Order</label><input id="sort" type="number" value="0"></div></div>
<div><div><label>Product Image</label><input id="image" type="file" accept="image/*"></div></div>
</div>
<label>Description</label><textarea id="description" placeholder="শাড়ীর বিস্তারিত বিবরণ"></textarea>
<label style="display:flex;align-items:center;gap:8px"><input id="active" type="checkbox" checked style="width:auto"> Website-এ দেখাবেন (Active)</label>
<div class="actions"><button id="saveBtn">💾 Save Product</button><button id="clearBtn" style="background:#777">Clear</button></div>
<p id="msg" class="muted"></p>
</div>

<div class="card">
<div class="row"><h3 style="margin:0">📦 Products</h3><button id="refreshBtn" style="width:auto">Refresh</button></div>
<div id="list">Loading...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://mwwcjzphynpnyuofztrj.supabase.co";
const SUPABASE_KEY="sb_publishable_ZQgpmqi1cBnm6b0lyTOXXQ_sQQnLPc4";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const bucket="product-images";

const $=id=>document.getElementById(id);
const money=v=>"৳"+Number(v||0).toLocaleString("bn-BD");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 if(session){$("login").classList.add("hide");$("app").classList.remove("hide");loadProducts();}
 else{$("login").classList.remove("hide");$("app").classList.add("hide");}
}
$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Login হচ্ছে...";
 const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 $("loginMsg").textContent=error?("❌ "+error.message):"✅ Login সফল";
 if(!error)checkSession();
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();location.reload()};

async function loadProducts(){
 const box=$("list"); box.textContent="Loading...";
 const {data,error}=await db.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});
 if(error){box.innerHTML="<p>❌ "+esc(error.message)+"</p>";return}
 if(!data.length){box.innerHTML="<p class='muted'>কোনো product নেই। উপরের form দিয়ে প্রথম product যোগ করুন।</p>";return}
 box.innerHTML=data.map(p=>`
 <div class="product">
 ${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:`<div style="width:90px;height:110px;background:#eee;border-radius:10px;display:grid;place-items:center">SAREE</div>`}
 <div>
 <b>${esc(p.name)}</b> ${p.active?'🟢':'⚪'}
 <div class="muted">${esc(p.description||"")}</div>
 <div><s>${p.regular_price?money(p.regular_price):""}</s> <strong style="color:#8d1238">${money(p.offer_price??p.regular_price)}</strong></div>
 <div class="actions">
 <button onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button>
 <button class="danger" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
 </div>
 </div>
 </div>`).join("");
}

window.editProduct=p=>{
 $("editId").value=p.id;$("name").value=p.name||"";$("badge").value=p.badge||"";
 $("regular").value=p.regular_price??"";$("offer").value=p.offer_price??"";
 $("sort").value=p.sort_order??0;$("description").value=p.description||"";$("active").checked=p.active!==false;
 $("image").value="";window.scrollTo({top:0,behavior:"smooth"});$("saveBtn").textContent="💾 Update Product";
};

$("clearBtn").onclick=()=>{
 ["editId","name","badge","regular","offer","sort","description"].forEach(id=>$(id).value="");
 $("active").checked=true;$("image").value="";$("saveBtn").textContent="💾 Save Product";$("msg").textContent="";
};

$("saveBtn").onclick=async()=>{
 const user=(await db.auth.getUser()).data.user;
 if(!user){alert("Please login again");return}
 const id=$("editId").value;
 const name=$("name").value.trim();
 const offer=Number($("offer").value);
 if(!name||!offer){$("msg").textContent="❌ Product Name এবং Offer Price দিন";return}
 $("msg").textContent="Saving...";
 let image_url=null;
 const file=$("image").files[0];
 if(file){
   const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");
   const path=Date.now()+"-"+safe;
   const up=await db.storage.from(bucket).upload(path,file,{upsert:false});
   if(up.error){$("msg").textContent="❌ Image upload: "+up.error.message;return}
   image_url=db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
 }
 const payload={
   name,description:$("description").value.trim(),badge:$("badge").value.trim()||null,
   regular_price:Number($("regular").value)||null,offer_price:offer,
   sort_order:Number($("sort").value)||0,active:$("active").checked
 };
 if(image_url)payload.image_url=image_url;
 let result;
 if(id)result=await db.from("products").update(payload).eq("id",id);
 else result=await db.from("products").insert(payload);
 if(result.error){$("msg").textContent="❌ "+result.error.message;return}
 $("msg").textContent="✅ Product saved";
 $("clearBtn").click();loadProducts();
};

window.deleteProduct=async id=>{
 if(!confirm("এই product Delete করবেন?"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error)alert("❌ "+error.message);else loadProducts();
};
$("refreshBtn").onclick=loadProducts;
checkSession();
</script>
</body>
</html>
